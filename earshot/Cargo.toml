[package]
name = "earshot"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"
description = "Offline activation-to-audio capture with semantic endpointing"
keywords = ["audio", "speech", "vad", "endpointing", "microphone"]
categories = ["multimedia::audio", "api-bindings"]
exclude = ["earshot-audit/", "fixtures/", "clippy.toml"]

[features]
default = []
serde = ["dep:serde"]
tooling = ["dep:hound", "serde"]

[dependencies]
cpal = "=0.18.2"
crossbeam-channel = "0.5"
hound = { version = "=3.5.1", optional = true }
ort = "=2.0.0-rc.12"
realfft = "=3.5.0"
ringbuf = { version = "=0.5.3", default-features = false, features = ["alloc"] }
rubato = "=5.0.1"
serde = { version = "1", features = ["derive"], optional = true }
silero = "=0.7.0"
thiserror = "2"

[dev-dependencies]
hound = "=3.5.1"
proptest = "1"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"


[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
