[package]
name = "teto-speech"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = []
testing = []
cmudict = ["dep:sha2"]
g2p-gru = ["dep:sha2", "dep:zip", "dep:npyz", "dep:ndarray"]
voicebank-wav = ["dep:sha2", "dep:zip", "dep:encoding_rs", "dep:hound"]
psola = []
device-cpal = []
llm-adapter = ["dep:teto-llm-protocol"]

[dependencies]
thiserror = "2"
arrayvec = "0.7"
bitflags = "2"
sha2 = { version = "0.10", optional = true }
zip = { version = "2.4", default-features = false, features = ["deflate-miniz"], optional = true }
encoding_rs = { version = "0.8", optional = true }
hound = { version = "3.5", optional = true }
npyz = { version = "0.8", optional = true }
ndarray = { version = "0.17", optional = true }
teto-llm-protocol = { path = "../teto-llm-protocol", optional = true }

[dev-dependencies]
proptest = "1"
tempfile = "3"
serde_json = "1"
teto-llm-protocol = { path = "../teto-llm-protocol" }
