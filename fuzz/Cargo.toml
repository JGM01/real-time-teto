[package]
name = "teto-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
teto-speech = {path="../teto-speech",features=["cmudict","voicebank-wav","testing"]}
libfuzzer-sys = "0.4"
teto-llm = { path = "../teto-llm", features = ["testing"] }
teto-llm-protocol = { path = "../teto-llm-protocol" }

[[bin]]
name = "text"
path = "fuzz_targets/text.rs"
test = false
doc = false

[[bin]]
name = "frame"
path = "fuzz_targets/frame.rs"
test = false
doc = false

[[bin]]
name = "oto"
path = "fuzz_targets/oto.rs"
test = false
doc = false

[[bin]]
name = "alias_planner"
path = "fuzz_targets/alias_planner.rs"
test = false
doc = false
