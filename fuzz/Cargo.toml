[package]
name = "teto-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
teto-llm = { path = "..", features = ["testing"] }
teto-llm-protocol = { path = "../teto-llm-protocol" }

[[bin]]
name = "text"
path = "fuzz_targets/text.rs"
test = false
doc = false

[[bin]]
name = "frame"
path = "fuzz_targets/frame.rs"
test = false
doc = false
